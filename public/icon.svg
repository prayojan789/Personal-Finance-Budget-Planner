<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" fill="#3b82f6"/>
  
  <!-- Money bag icon -->
  <g transform="translate(96, 96)">
    <!-- Bag shape -->
    <path d="M -30 -20 L -30 20 Q -30 40 -10 40 L 10 40 Q 30 40 30 20 L 30 -20 Z" 
          fill="white" stroke="white" stroke-width="2"/>
    
    <!-- Dollar sign -->
    <text x="0" y="15" font-size="40" font-weight="bold" fill="#3b82f6" 
          text-anchor="middle" font-family="Arial, sans-serif">$</text>
    
    <!-- Drawstring -->
    <line x1="-30" y1="-20" x2="30" y2="-20" stroke="white" stroke-width="3"/>
    <circle cx="-20" cy="-25" r="3" fill="white"/>
    <circle cx="20" cy="-25" r="3" fill="white"/>
  </g>
</svg>
